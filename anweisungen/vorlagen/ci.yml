# Vorlage: .github/workflows/ci.yml – Prüfungen bei jedem Pull Request
# Anweisung 01: https://github.com/Bamberger-IT-Services/public/tree/main/anweisungen
#
# Anpassen (Suche nach „ANPASSEN“): Pfadfilter, Paketmanager (pnpm ↔ npm), Skriptnamen,
# Image-Ziele im Job „image-probe“. Erwartet in package.json die Skripte
# lint, typecheck, test, test:db (Tests mit Datenbank), build.
#
# Rechner: Repo-Variable EIGENER_RUNNER (z. B. ["self-hosted","bits"], Anweisung 01 › 2).
# Leer → GitHubs Rechner (ubuntu-latest); dann laufen DB-Tests und Image-Probe nur von Hand,
# um GitHub-Minuten zu sparen.
#
# Kein Lauf bei Pushes auf main: Jeder Stand auf main kam über einen geprüften PR.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      testdateien:
        description: "Nur diese Testdateien (mit Leerzeichen getrennt) – leer = alles"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Welche Teile berührt der PR? Teure Jobs laufen nur, wenn nötig.
  aenderungen:
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    outputs:
      app: ${{ steps.filter.outputs.app }}
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          EREIGNIS: ${{ github.event_name }}
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EREIGNIS" = "pull_request" ] && git cat-file -e "$BASIS^{commit}" 2>/dev/null; then
            dateien="$(git diff --name-only "$BASIS"...HEAD)"
          else
            dateien="$(git ls-files)"
          fi
          treffer() { printf '%s\n' "$dateien" | grep -Eq "$1" && echo true || echo false; }
          {
            # ANPASSEN: was zählt als App-Code, was betrifft die Images?
            echo "app=$(treffer '^(src/|tests/|drizzle/|package\.json$|pnpm-lock\.yaml$|\.nvmrc$|\.github/workflows/ci\.yml$)')"
            echo "images=$(treffer '^(src/|drizzle/|docker/|Dockerfile|package\.json$|pnpm-lock\.yaml$|deploy/)')"
          } | tee -a "$GITHUB_OUTPUT"

  # Lint, Typen, Unit-Tests, Build – schnell, bei jedem PR mit App-Änderungen.
  pruefen:
    needs: aenderungen
    if: needs.aenderungen.outputs.app == 'true' && !inputs.testdateien
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4          # ANPASSEN: bei npm entfernen
      - uses: actions/setup-node@v5         # auf dem eigenen Runner ist Node nicht vorinstalliert
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"                     # ANPASSEN: "npm"
      - run: pnpm install --frozen-lockfile # ANPASSEN: npm ci
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test -- --coverage        # Abdeckung im Lauf sichtbar (Anweisung 06)
      - run: pnpm run build
      # Bekannte Lücken in Laufzeit-Abhängigkeiten (hoch/kritisch) brechen ab.
      - run: pnpm audit --prod --audit-level high   # ANPASSEN: npm audit --omit=dev --audit-level=high

  # Geheimnisse dürfen nie ins Repo – prüft den ganzen PR-Verlauf.
  geheimnisse:
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 \
            git --log-opts="$BASIS..HEAD" --redact --no-banner

  # Tests mit Datenbank – nur gegen eine Wegwerf-Datenbank, nie gegen echte Daten.
  db-test:
    needs: aenderungen
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.EIGENER_RUNNER != '' && needs.aenderungen.outputs.app == 'true')
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    services:
      db:
        image: supabase/postgres:17.6.1.136   # ANPASSEN: dieselbe Version wie im Betrieb
        env:
          POSTGRES_PASSWORD: nur-fuer-tests
        ports: ["127.0.0.1:55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:nur-fuer-tests@127.0.0.1:55432/postgres
      TESTDATEIEN: ${{ inputs.testdateien }}
      # Eigener Runner: mehr Prozesse als auf GitHubs Rechnern.
      PROZESSE: ${{ vars.EIGENER_RUNNER != '' && '4' || '2' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Migrationen wie beim Start im Betrieb
        run: pnpm run db:migrate             # ANPASSEN
      - name: Tests (Schnelllauf möglich)
        run: |
          # Nur Pfadzeichen zulassen – das Feld kommt von außen.
          if [ -n "$TESTDATEIEN" ] && ! printf '%s' "$TESTDATEIEN" | grep -Eq '^[][A-Za-z0-9_./ -]+$'; then
            echo "Ungültige Zeichen im Feld testdateien." >&2; exit 1
          fi
          # shellcheck disable=SC2086
          pnpm run test:db -- --maxWorkers "$PROZESSE" $TESTDATEIEN

  # Bauen die Images noch? Startet die App? (ohne Push)
  image-probe:
    needs: [aenderungen, pruefen]
    if: >-
      always() && !inputs.testdateien &&
      (github.event_name == 'workflow_dispatch' || (vars.EIGENER_RUNNER != '' && needs.aenderungen.outputs.images == 'true')) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
      # Eigener Runner: Builder „docker“ → der Layer-Cache bleibt zwischen den Läufen.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ vars.EIGENER_RUNNER != '' && 'docker' || 'docker-container' }}
      # ANPASSEN: je Image eine Zeile (alle Endstufen ausdrücklich nennen).
      - run: docker build --target web -t projekt-web:ci .
      - run: docker build --target worker -t projekt-worker:ci .
      - name: Rauchtest – App startet und meldet sich gesund
        run: |
          docker run -d --name rauch -p 127.0.0.1:3000:3000 -e DATABASE_URL=postgres://x:x@127.0.0.1:1/x projekt-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/health
          docker rm -f rauch
