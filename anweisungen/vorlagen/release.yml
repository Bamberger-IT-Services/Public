# Vorlage: .github/workflows/release.yml – Images bauen, wenn ein GitHub-Release
# veröffentlicht wird. Anweisung 01: https://github.com/Bamberger-IT-Services/public/tree/main/anweisungen
#
# Ablauf:
# 1. prüfen:  Tag vX.Y.Z passt zu allen Versionsnummern, zeigt auf einen Stand von main.
# 2. images:  jedes Image mit Tag X.Y.Z nach GHCR (eigener Runner: Builder „docker“ mit
#             bleibendem Cache; GitHubs Rechner: GitHub-Actions-Cache).
# 3. scannen: Trivy prüft die Images auf bekannte Lücken (HIGH/CRITICAL → Bericht).
# 4. latest:  erst wenn ALLE Images oben sind: „latest“ für alle zugleich und Branch
#             „stabil“ auf den Tag – nur für die höchste Version, nie für Vorab-Releases.
# Nachbauen: Actions › Release › „Run workflow“ mit dem Tag (z. B. v1.2.0).
#
# ANPASSEN: VERSIONSDATEIEN, Matrix „images“, Liste in „latest“.
name: Release

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag, das gebaut werden soll (z. B. v1.2.0)"
        required: true

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  VORAB: ${{ github.event.release.prerelease == true }}
  # ANPASSEN: alle Dateien mit Versionsnummer (JSON-Pfad nach dem Doppelpunkt)
  VERSIONSDATEIEN: "package.json:version"

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
      sha: ${{ steps.v.outputs.sha }}
      prefix: ${{ steps.v.outputs.prefix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - id: v
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          case "$TAG" in *[!A-Za-z0-9._-]*) echo "Ungültiges Tag: $TAG"; exit 1;; esac
          case "$TAG" in v[0-9]*) ;; *) echo "Release-Tag muss mit v beginnen: $TAG"; exit 1;; esac
          version="${TAG#v}"
          for eintrag in $VERSIONSDATEIEN; do
            datei="${eintrag%%:*}"; pfad="${eintrag#*:}"
            v=$(node -p "require('./$datei').$pfad")
            echo "$datei → $v"
            [ "$v" = "$version" ] || { echo "Versionsnummer in $datei passt nicht zum Tag"; exit 1; }
          done
          git merge-base --is-ancestor HEAD origin/main || { echo "Der Tag zeigt nicht auf einen Stand von main"; exit 1; }
          hoechste=$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n1)
          latest=false
          if [ "$VORAB" != "true" ] && [ "$hoechste" = "$TAG" ]; then latest=true; fi
          {
            echo "version=$version"
            echo "latest=$latest"
            echo "sha=$(git rev-parse HEAD)"
            echo "prefix=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"

  images:
    needs: pruefen
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:                           # ANPASSEN
          - { name: projekt-web,    datei: Dockerfile,             target: web,    kontext: . }
          - { name: projekt-worker, datei: Dockerfile,             target: worker, kontext: . }
          - { name: projekt-ocr,    datei: docker/ocr/Dockerfile,  target: "",     kontext: docker/ocr }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ vars.EIGENER_RUNNER != '' && 'docker' || 'docker-container' }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # nie ein persönliches Token
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.pruefen.outputs.prefix }}/${{ matrix.name }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.pruefen.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.kontext }}
          file: ${{ matrix.datei }}
          target: ${{ matrix.target }}
          build-args: |
            APP_VERSION=${{ needs.pruefen.outputs.version }}
            APP_BUILD=${{ needs.pruefen.outputs.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # OCI: source, version, revision
          cache-from: ${{ vars.EIGENER_RUNNER == '' && format('type=gha,scope={0}', matrix.name) || '' }}
          cache-to: ${{ vars.EIGENER_RUNNER == '' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
      # Bekannte Lücken im Image: Bericht in der Zusammenfassung des Laufs; bricht nicht ab,
      # damit ein Release nicht an einer Lücke ohne Fix hängt. Funde → Aufgabe im Projekt.
      # Scanner-Images immer mit fester Version, nie „latest“ (Lieferketten-Angriffe auf Scanner gab es).
      - name: Image scannen (Trivy)
        env:
          IMAGE: ${{ needs.pruefen.outputs.prefix }}/${{ matrix.name }}:${{ needs.pruefen.outputs.version }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.69.3 \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress --format table "$IMAGE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  latest:
    needs: [pruefen, images]
    if: needs.pruefen.outputs.latest == 'true'
    runs-on: ${{ fromJSON(vars.EIGENER_RUNNER || '"ubuntu-latest"') }}
    permissions:
      packages: write
      contents: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: latest für alle Images zugleich setzen
        env:
          V: ${{ needs.pruefen.outputs.version }}
          P: ${{ needs.pruefen.outputs.prefix }}
        run: |
          for name in projekt-web projekt-worker projekt-ocr; do   # ANPASSEN
            docker buildx imagetools create -t "$P/$name:latest" "$P/$name:$V"
          done
      # Die Produktiv-VM holt Compose-Datei und Betriebsskripte per `git pull` aus „stabil“.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Branch stabil auf das Release setzen
        run: git push --force origin "HEAD:refs/heads/stabil"
